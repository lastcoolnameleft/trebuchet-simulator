<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyodide Trebuchet Simulator</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <h1>Pyodide Trebuchet Simulator</h1>
        <p>
          Analytical trebuchet physics in Python via SciPy + Pyodide, with canvas rendering in JavaScript.
        </p>
      </header>

      <section class="layout">
        <aside class="panel controls">
          <div class="status-bar">
            <span id="statusText" data-state="ok">Loading Pyodide and scientific packages…</span>
          </div>

          <div class="toggle-row">
            <label class="toggle">
              <input id="autoDerived" type="checkbox" checked />
              <span>Auto-calc derived values</span>
            </label>
            <label class="toggle">
              <input id="enableAirDrag" type="checkbox" />
              <span>Enable air drag</span>
            </label>
          </div>

          <form id="parameterForm" class="form-grid"></form>

          <div class="actions">
            <button id="fireButton" class="primary" type="button" disabled>Fire</button>
            <button id="resetButton" class="secondary" type="button">Reset</button>
          </div>
        </aside>

        <section class="panel visuals">
          <div class="canvas-wrap">
            <canvas id="simCanvas" width="960" height="560"></canvas>
            <div id="loadingOverlay" class="loading-overlay">
              <div class="loading-card">
                <strong>Loading Pyodide runtime…</strong>
                <span>First load takes a few seconds while Python, NumPy, and SciPy initialize.</span>
              </div>
            </div>
          </div>

          <div id="statsGrid" class="stats-grid"></div>
        </section>
      </section>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
