<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23fb7185' d='M5 26h22v3H5zm10-20h3v15h-3zm0 0 9 6-1.7 2.4L14 9.5zM9 15c0-2.2 1.8-4 4-4v2a2 2 0 1 0 2 2h2a4 4 0 1 1-8 0z'/%3E%3C/svg%3E" />
    <title>TypeScript Trebuchet Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e293b, #020617 65%);
      }
      #app {
        display: grid;
        grid-template-columns: minmax(320px, 380px) 1fr;
        gap: 20px;
        padding: 20px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      .panel,
      .sim-panel {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.35);
      }
      .panel {
        padding: 18px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        line-height: 1.4;
        margin: 0 0 16px;
      }
      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.82rem;
        color: #cbd5e1;
      }
      input {
        border-radius: 10px;
        border: 1px solid #334155;
        background: #020617;
        color: #e2e8f0;
        padding: 10px 12px;
        font: inherit;
      }
      .controls,
      .stats {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 700;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: linear-gradient(135deg, #f97316, #fb7185);
        color: white;
      }
      button.secondary {
        background: #1e293b;
        color: #e2e8f0;
      }
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .stat {
        background: rgba(30, 41, 59, 0.75);
        border-radius: 14px;
        padding: 12px;
      }
      .stat .label {
        color: #94a3b8;
        font-size: 0.78rem;
      }
      .stat .value {
        font-size: 1.2rem;
        font-weight: 700;
        margin-top: 4px;
      }
      .sim-panel {
        padding: 12px;
        display: flex;
        flex-direction: column;
      }
      canvas {
        width: 100%;
        height: calc(100vh - 44px);
        min-height: 640px;
        display: block;
        border-radius: 14px;
        background: linear-gradient(#0f172a, #1d4ed8 62%, #14532d 62%, #166534 100%);
      }
      .status {
        margin-top: 12px;
        color: #cbd5e1;
        font-size: 0.9rem;
      }
      .status strong {
        color: #f8fafc;
      }
      .full-span {
        grid-column: 1 / -1;
      }
      @media (max-width: 1120px) {
        #app {
          grid-template-columns: 1fr;
        }
        canvas {
          height: 70vh;
          min-height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="panel">
        <h1>Trebuchet Bake-off — TypeScript</h1>
        <p>
          Analytical Lagrangian model with fixed-step RK4 integration. The sling stays on the ground until lift-off,
          releases when the projectile flight angle matches the target, then flies ballistically.
        </p>
        <form id="controls"></form>
        <div class="controls">
          <button id="fireButton" class="primary" type="button">Fire</button>
          <button id="resetButton" class="secondary" type="button">Reset</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="status" id="status"></div>
      </aside>
      <section class="sim-panel">
        <canvas id="simCanvas" width="1280" height="720"></canvas>
      </section>
    </div>
    <script src="./dist/bundle.js"></script>
  </body>
</html>
